taker_rebate_program:
  start: "2026-05-28"
  basis: "share of taker fees paid (one exact reconciliation: 18% Gold rebate = 0.18 x a wallet's 2026-06-16 fees to the cent)"
  weighted_volume: "wV = notional_usd * (1 - entry_price) * category_weight * bonuses; taker trades only; 30-day rolling; updated daily 00:00 UTC; no backfill"
  tiers:   # [tier, name, wv_30d_min_usd, rebate_share_of_fees, level_up_bonus_usd]
    - [0, None,     0,        0.00, 0]
    - [1, Bronze,   2000,     0.03, 10]
    - [2, Silver,   20000,    0.08, 50]
    - [3, Gold,     200000,   0.18, 250]
    - [4, Platinum, 1000000,  0.32, 1500]
    - [5, Diamond,  4000000,  0.44, 7500]
    - [6, Obsidian, 10000000, 0.50, 25000]
  payout: "pUSD, documented daily at 00:00 UTC, $1 minimum; observed payouts for two wallets were batched (2026-06-23, 2026-07-08)"
  exclusions: ["geopolitics / fee-free markets earn no wV", "omnibus-wallet integrations", "wash/self-matching"]
  can_change_without_notice: true
  status: VERIFIED
  sources: [https://docs.polymarket.com/programs/taker-rebates.md]

maker_rebates:
  funding: "rebateRate x taker fees collected in the same market"
  distribution: "daily per market, pro rata to fee_equivalent = shares * rate * p * (1 - p) of the maker's filled orders"
  share_by_category: {crypto: 0.20, sports: 0.15, sports_legacy_v2: 0.25, others: 0.25, geopolitics: null}
  payout: "pUSD daily, $1 minimum accrued"
  per_maker_query: "GET https://clob.polymarket.com/rebates/current?date=YYYY-MM-DD&maker_address=0x.. (public; maker rebates only, not taker)"
  discretionary: true
  status: VERIFIED
  sources: [https://docs.polymarket.com/programs/maker-rebates.md, https://docs.polymarket.com/api-reference/rebates/get-current-rebated-fees-for-a-maker.md]

liquidity_rewards:
  scoring: "S(v,s) = ((v - s)/v)^2 * b ; v = max spread (cents) from size-cutoff-adjusted midpoint, s = order spread, b = in-game multiplier"
  sides: "Q_one/Q_two sum bids on m + asks on complement (and vice versa); Q_min = max(min(Q1,Q2), max(Q1/c, Q2/c)) if 0.10 <= mid <= 0.90 else min(Q1,Q2); c = 3.0"
  sampling: "once per minute at random offset; epoch = UTC day (<= 1,440 samples); two-stage normalization"
  per_market_params: "Gamma rewardsMinSize (shares), rewardsMaxSpread (cents), clobRewards[].rewardsDailyRate; CLOB /rewards/markets/current"
  min_payout_usd: 1
  min_order_age_note: "3.5 s minimum resting time quoted for March Madness 2026 (changelog); order-scoring endpoint mentions a required live duration"
  live_snapshot_2026_10_17: {markets: 14608, total_daily_rate_usd: 289412, sponsored_daily_usd: 3994, median_market_daily_usd: 3.0, p99_market_daily_usd: 104, max_market_daily_usd: 8850, asset: pUSD}
  temporary_programs: ["March Madness $2M+ (from 2026-03-17)", "Crypto TWAP $1M through August 2026 (ended)"]
  status: VERIFIED
  sources: [https://docs.polymarket.com/programs/liquidity-rewards.md, https://docs.polymarket.com/api-reference/rewards/get-current-active-rewards-configurations.md]

holding_rewards:
  field: holdingRewardsEnabled
  rate_stated: {docs_positions_tokens: 0.04, help_center_2026_06_01: 0.0325}
  mechanics: "position value (Yes+No shares x latest mid) sampled hourly at random; paid daily (activity type YIELD, ~00:10 UTC)"
  funded_by: "Polymarket Treasury; rate and caps discretionary"
  open_markets_enabled: {markets: 339, events: 41}
  observed: "one large holder's YIELD payouts imply ~1.7-1.8% APY on current eligible value (unexplained; open question)"
  status: VERIFIED   # existence and daily payment; rate UNRESOLVED
  sources: [https://docs.polymarket.com/concepts/positions-tokens.md, https://help.polymarket.com/en/articles/13364459-holding-rewards]

referral_program:
  terms_effective: "2026-05-28"
  eligibility: "referrer lifetime volume >= $10,000"
  reward: {direct: 0.10, indirect: 0.05, basis: "net fees = fees after the referred user's tier rebate"}
  caps: "ends when referral reaches Platinum or 30 days after sign-up, whichever first"
  previous_terms_secondary: "30% of gross taker fees direct / 10% indirect around 2026-03-30 (Pine Analytics)"
  status: VERIFIED
  sources: [https://docs.polymarket.com/programs/referral-program.md]

builder_fees:
  expr: "builder_fee = notional * builder_bps / 10000 (flat, additive to platform fee)"
  limits_bps: {taker_max: 100, maker_max: 50, default: 0}
  change_policy: "one change per 7 days, effective 3 days after scheduling"
  note: "a third-party front end can charge you up to 1% of notional as taker on top of platform fees; makers can be charged up to 0.5%"
  status: VERIFIED
  sources: [https://docs.polymarket.com/programs/builders/fees.md]

exchange_contract_cap:
