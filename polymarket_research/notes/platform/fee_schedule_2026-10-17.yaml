# Polymarket (international, docs.polymarket.com) fee, rebate and incentive schedule as of 2026-10-17.
# Machine-readable companion to notes/platform/fees_incentives.md (read that file for caveats).
# status: VERIFIED = checked against official docs and/or live API / on-chain data on 2026-10-17
#         PLAUSIBLE = consistent with evidence but not directly verified; SECONDARY = news/blog only.
# Polymarket US (the separate CFTC-regulated app) has a different schedule and is out of scope.

as_of: "2026-10-17"
scope: "Polymarket international CLOB (Protocol V2, pUSD collateral)"

fee_formula:
  current:
    expr: "fee_pusd = shares * rate * p * (1 - p)"
    applies_since: "<= 2026-04-29 (on-chain); docs formula since ~2026-03-31/04-01 (secondary)"
    payer: taker_only            # makers never pay a platform fee
    charged_in: pUSD             # buy: added on top of notional; sell: deducted from proceeds
    rounding: "5 decimal places; fees < 0.00001 round to 0"
    per_market_source: "Gamma feeSchedule {rate, exponent, takerOnly, rebateRate}; CLOB /clob-markets/{condition_id} fd {r, e, to}"
    status: VERIFIED
    sources:
      - https://docs.polymarket.com/trading/fees.md
      - https://docs.polymarket.com/market-data/market-details.md
      - https://docs.polymarket.com/programs/builders/fees.md
      - "on-chain OrderFilled.fee, 20,740 V2 taker fills at 21 dates 2026-04-29..2026-10-16 (analyses/fees/onchain_fee_sampler.py)"
  legacy_v1:
    expr: "fee = shares * p * rate * (p * (1 - p)) ** exponent"
    used_for: "15-min crypto (2026-01-05), 5-min crypto (2026-02-12), all crypto (new markets from 2026-03-06): rate 0.25, exponent 2 (peak 1.56% of notional at p=0.5); NCAAB/Serie A sports (2026-02-18): rate 0.0175, exponent 1 (peak 0.44%)"
    also_used_by: "Fee Structure V2 announcement of 2026-03-30 (crypto 0.072, sports 0.03, ...), replaced within days by the current formula"
    status: PLAUSIBLE   # params VERIFIED on legacy Gamma markets (crypto_15_min, crypto_fees, sports_fees); formula from changelog peak % + secondary
    sources:
      - https://docs.polymarket.com/changelog/predictions.md
      - https://pineanalytics.substack.com/p/polymarket-fee-rollout
      - https://news.cnyes.com/news/id/6404252
      - https://igamingbusiness.com/prediction-markets/polymarket-sports-fee-hike-2026/

