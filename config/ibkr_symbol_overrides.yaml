# Manual yfinance -> IBKR symbol overrides.
#
# Use ONLY for genuine vendor symbol-string differences for the SAME local
# listing (verified via ib.reqMatchingSymbols / reqContractDetails). This is
# NOT a place to change currency or exchange to force a resolution — an ADR or
# wrong-currency line must still be rejected by the validator.
#
# Schema (per entry, keyed by the yfinance/model ticker):
#   ibkr_symbol       : the symbol string IBKR expects
#   exchange          : routing exchange to try (SMART preferred)
#   primary_exchange  : expected IBKR primaryExchange of the local line
#   currency          : expected local currency (must match security_master)
#   reason            : why the override exists + what to reject
#   verified          : date the mapping was confirmed against IBKR
#
# The validator still applies ALL hard rules to the overridden contract
# (currency match, non-US venue, secType STK, name match, ambiguity).

overrides:
  WRT1V.HE:
    ibkr_symbol: WRT
    exchange: SMART
    primary_exchange: HEX
    currency: EUR
    reason: >-
      yfinance 'WRT1V.HE' = IBKR symbol 'WRT' (Wartsila Oyj Abp) on HEX/EUR,
      conId 12542999. The US line 'WRTBY' on PINK/USD is an ADR and must be
      rejected; only the Helsinki EUR common is tradable.
    verified: 2026-05-15

# Accepted-name whitelist: model_ticker -> a substring that, if present in the
# IBKR longName (accent/punct-insensitive), confirms it IS the same company
# despite a legal-name / rebrand / translation difference. ONLY for cases
# verified by hand to be the same issuer. The contract still must pass currency,
# venue (non-US for non-US), secType and ambiguity checks — this only relaxes
# the longName string comparison (rule 7).
name_aliases:
