# HKEX ramp-and-dump research configuration.
# Every threshold here is a research hypothesis, not an established optimum.
# Changing anything under `sample`, `events.primary` or `labels` after the
# holdout has been unlocked invalidates the holdout (see go_no_go.yaml).

paths:
  data_dir: data                 # relative to hk_ramp_dump/
  raw_dir: data/raw              # gitignored: vendor downloads
  store_dir: data/store          # gitignored: parquet store (DuckDB reads it)
  reference_dir: data/reference  # small, committed reference tables
  outputs_dir: outputs

data_source: yfinance_pilot      # yfinance_pilot | webbsite | capiq (see docs/01_feasibility.md)

universe:
  sub_categories:
    - "Equity Securities (Main Board)"
    - "Equity Securities (GEM)"
  trading_currency: HKD
  benchmark_tickers: ["^HSI", "2800.HK"]
  # Detection runs on everything. Trading universes are filtered later.
  min_history_days: 140

sample:
  start: "2012-01-01"
  # Chronological split. Walk-forward folds live inside `development`.
  development: ["2012-01-01", "2022-12-31"]
  validation:  ["2023-01-01", "2024-06-30"]
  holdout:     ["2024-07-01", "2026-10-27"]
  first_test_year: 2016          # walk-forward test years 2016..2022
  embargo_days: 20               # >= longest label horizon

data_quality:
  # Daily close/close ratios that look like an unadjusted consolidation or
  # split (vendor error) are masked: |log ratio| close to log(k).
  suspect_factors: [2, 4, 5, 8, 10, 20, 25, 40, 50, 100]
  suspect_tolerance: 0.03        # in log space
  suspect_min_abs_return: 0.6    # only test moves larger than this
  mask_days_around: 2
  max_abs_daily_logret: 2.5      # anything larger is treated as a bad print

events:
  baseline_window: 120           # trading days for the "normal" volume regime
  episode_gap_days: 5            # qualifying days closer than this merge
  min_baseline_value_hkd: 0      # detection is liquidity-agnostic
  primary:
    run_days: 20
    run_return: 0.80             # close / min(close over window) - 1
    excess_vs_market: true
    value_multiple: 5.0          # mean traded value in run / baseline median
    post_window: 20
    drawdown: 0.40
  sustained_window: 60           # category B test window
  sustained_max_drawdown: 0.25
  grid:
    run_days: [5, 10, 20]
    run_return: [0.5, 0.8, 1.5]
    value_multiple: [3.0, 5.0, 10.0]
    post_window: [20, 60]
    drawdown: [0.3, 0.4, 0.6]

features:
  windows: [1, 3, 5, 10, 20, 60]
  baseline_window: 120

labels:
  horizons: [1, 3, 5, 10, 20]
  drawdown_horizon: 20
  drawdown_thresholds: [0.20, 0.30, 0.40]
  primary_target: dd20_40        # P(min close over t+1..t+20 <= -40% vs close t)

candidate_filter:                # stage 1 of Model D / population for Strategy A
  ret_20_min: 0.50
  value_ratio_20_min: 3.0

models:
  random_seed: 7
  lightgbm:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 5.0
  negative_subsample: 0.10       # Model C trains on all stock-days: subsample easy negatives
  hmm:
    n_states: 3
    n_iter: 50
    fit_sample_tickers: 400

execution:
  signal_time: close             # signals use data up to and including close t
  fill: next_open                # earliest realistic execution: t+1 opening auction
  delay_stress_days: [0, 1, 2]   # extra days of delay in stress tests
  participation: [0.01, 0.02, 0.05]
  adv_window: 20
  # Spread: max(1 tick, estimated half-spread). Impact: k * sigma * sqrt(participation)
  impact_k: 1.0
  spread_multiplier_stress: [1.0, 2.0, 3.0]
  short_fill_haircut_down_day: 0.5   # tick rule: fills are harder on falling days
  brokerage_bps: 8.0
  brokerage_min_hkd: 50.0

shorting:
  require_designated_list: true
  # No historical borrow data is available in the pilot; these are stress
  # assumptions, not observations.
  borrow_fee_annual:
    large: 0.01                  # ADV20 >= HK$200m
    mid: 0.05                    # ADV20 >= HK$20m
    small: 0.20                  # otherwise
  borrow_fee_stress_multiplier: [1.0, 2.0, 4.0]
  locate_failure_prob:
    large: 0.02
    mid: 0.15
    small: 0.50
  daily_recall_prob: 0.005

portfolio:
  nav_hkd: [10_000_000, 50_000_000, 200_000_000]
  max_position_nav: 0.02
  max_gross: 0.50
  max_positions: 25
